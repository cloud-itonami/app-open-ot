name: openot-gate-c

# Gate C follow-up evidence per risk1/gate-c-estimate/gate-c-report.md.
# Runs on every change that touches the open-ot scope.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/openot-gate-c.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/openot-gate-c.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OPEN_OT: .

jobs:
  # Gate C §2.3 — cargo geiger gate
  geiger:
    name: cargo geiger (no unsafe outside ABI wrappers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: Run cargo geiger on cells/
        working-directory: ${{ env.OPEN_OT }}/cells
        run: |
          cargo geiger --workspace --all-features --update-readme=false || true
          # Geiger exit code reflects unsafe density; we don't gate on it
          # because the ABI wrappers are intentional unsafe. We commit the
          # output as evidence; the by-construction argument lives in
          # docs/openot-bfb-rs-memory-safety.md.
          cargo geiger --workspace --all-features --output-format Ratio --update-readme=false || true

  # Gate C §2.1 — reproducibility harness
  repro-build:
    name: repro-build (4 cells × 2 clean builds, BLAKE3 diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build repro-build-rs
        working-directory: ${{ env.OPEN_OT }}/repro-build-rs
        run: cargo build --release
      - name: Run reproducibility check
        working-directory: ${{ env.OPEN_OT }}/repro-build-rs
        run: ./target/release/repro-build
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: repro-build-report
          path: ${{ env.OPEN_OT }}/repro-build-rs/repro-build-report.md

  # Gate C §2.5 — builder-sign-rs tests
  builder-sign:
    name: builder-sign-rs (11 unit + integration tests + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build + test
        working-directory: ${{ env.OPEN_OT }}/builder-sign-rs
        run: cargo test --release
      - name: Build a wasm artefact to sign
        working-directory: ${{ env.OPEN_OT }}/cells
        run: |
          cargo build --release --no-default-features \
            --target wasm32-unknown-unknown -p droop-p-f
      - name: Sign + verify smoke test
        working-directory: ${{ env.OPEN_OT }}
        run: |
          BIN=./builder-sign-rs/target/release/builder-sign
          $BIN keygen --out /tmp/builder.key
          KEY=$(cat /tmp/builder.key)
          # Print key as private; pub key is on stderr.
          OUT=$($BIN sign \
              --input cells/target/wasm32-unknown-unknown/release/droop_p_f.wasm \
              --key /tmp/builder.key)
          echo "$OUT"
          SIG=$(echo "$OUT" | awk '/sig_ed25519:/ {print $2}')
          PUB=$(echo "$OUT" | awk '/pubkey_hex:/ {print $2}')
          $BIN verify \
              --input cells/target/wasm32-unknown-unknown/release/droop_p_f.wasm \
              --signature "$SIG" \
              --public-key "$PUB"
          shred -u /tmp/builder.key

  # Risk-1 Gate A (host approximation) — re-run from PR #232 evidence
  gate-a:
    name: gate-a-rig × 4 cells (host PASS @ 200 µs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build cells
        working-directory: ${{ env.OPEN_OT }}/cells
        run: |
          cargo build --release --no-default-features --target wasm32-unknown-unknown \
            -p pid-limited -p droop-p-f -p anti-islanding-rocof -p pid-stack-100 \
            -p vv-curve -p ltc-tap-fsm -p mppt-perturb-observe \
            -p black-start-seq -p soc-kalman
      - name: Build gate-a-rig
        working-directory: ${{ env.OPEN_OT }}/risk1/gate-a-rig
        run: cargo build --release
      - name: Run gate-a-rig on each cell with 200 µs deadline
        working-directory: ${{ env.OPEN_OT }}/risk1/gate-a-rig
        run: |
          for cell in pid_limited droop_p_f anti_islanding_rocof pid_stack_100 \
                       vv_curve ltc_tap_fsm mppt_perturb_observe \
                       black_start_seq soc_kalman; do
            echo "=== $cell ==="
            ../target/release/gate-a-rig --cell "$cell" \
              --iterations 50000 --deadline-ns 200000
          done

  # Risk-1 Gate B (host approximation) — re-run from PR #232 evidence
  gate-b:
    name: gate-b-rig (12 cells × 1000 super-steps × 4 crashes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build droop-p-f cell
        working-directory: ${{ env.OPEN_OT }}/cells
        run: |
          cargo build --release --no-default-features \
            --target wasm32-unknown-unknown -p droop-p-f
      - name: Build gate-b-rig
        working-directory: ${{ env.OPEN_OT }}/risk1/gate-b-rig
        run: cargo build --release
      - name: Run gate-b-rig
        working-directory: ${{ env.OPEN_OT }}/risk1/gate-b-rig
        run: |
          ../target/release/gate-b-rig \
            --num-cells 12 --super-steps 1000 --crash-count 4 \
            --deadline-superstep-ns 50000000 \
            --deadline-checkpoint-ns 100000000 \
            --max-resume-ns 5000000000

  # Cell unit tests (delegated; this is just a courtesy check that they pass)
  cells-tests:
    name: cells/ cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test all 5 cells (host-side, std)
        working-directory: ${{ env.OPEN_OT }}/cells
        run: cargo test --workspace --release

  # Codegen SSoT gate: cell manifests ↔ orchestrator/_generated must stay in sync.
  codegen-check:
    name: codegen --check (cell manifests ↔ _generated/*.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run codegen-cell-types.py --check
        run: python3 tools/codegen-cell-types.py --check

  # Orchestrator pytest — exercises every loop module + the _generated modules.
  orchestrator-tests:
    name: orchestrator pytest (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Build wasm cells the orchestrator depends on
        working-directory: ${{ env.OPEN_OT }}/cells
        run: |
          cargo build --release --no-default-features --target wasm32-unknown-unknown \
            -p pid-limited -p droop-p-f -p anti-islanding-rocof -p pid-stack-100 \
            -p vv-curve -p ltc-tap-fsm -p mppt-perturb-observe \
            -p black-start-seq -p soc-kalman
      - name: uv sync + pytest
        working-directory: ${{ env.OPEN_OT }}/orchestrator
        run: |
          uv sync
          uv run pytest -v

  # Gate C §2.3 — kani symbolic verification on tick + init paths
  kani:
    name: kani symbolic verification (${{ matrix.cell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell:
          - pid-limited
          - droop-p-f
          - anti-islanding-rocof
          - pid-stack-100
          - vv-curve
          - ltc-tap-fsm
          - mppt-perturb-observe
          - black-start-seq
          - soc-kalman
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install kani-verifier
        run: cargo install --locked kani-verifier
      - name: Kani version (triggers first-time setup download)
        run: cargo kani --version
      - name: Verify ${{ matrix.cell }}
        working-directory: ${{ env.OPEN_OT }}/cells/${{ matrix.cell }}
        run: |
          # Two harnesses per cell: proofs::tick_never_panics, proofs::init_never_panics.
          # pid-stack-100 carries a higher unwind bound for its 100-instance inner loop.
          cargo kani --harness proofs::init_never_panics
          cargo kani --harness proofs::tick_never_panics
