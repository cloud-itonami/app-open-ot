[package]
name = "gate-a-rig"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Risk-1 Gate A simulator — load a BFB cell as WASM in Wasmtime, run the workload, emit a latency report"

[[bin]]
name = "gate-a-rig"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "46", default-features = false, features = ["cranelift", "runtime"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
