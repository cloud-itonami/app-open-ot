[package]
name = "builder-sign-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/etzhayyim/root"
authors = ["etzhayyim"]
description = "open-ot builder signing CLI — Ed25519 sign + BLAKE3 CID for WASM / AOT artefacts per SPEC §9. Replaces the `scripts/builder-sign.sh` stub referenced in cells/CLAUDE.md."

[[bin]]
name = "builder-sign"
path = "src/main.rs"

[lib]
name = "builder_sign_rs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
bs58 = "0.5"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
